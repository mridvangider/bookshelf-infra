# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  planFile: $(Build.SourceVersion).tfplan

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: latest
  - task: AzureCLI@2
    inputs:
      azureSubscription: "tf-sp-on-ado"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        ./tf.sh init
    displayName: Terraform Init
    name: terraformInit
  - task: AzureCLI@2
    inputs:
      azureSubscription: "tf-sp-on-ado"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        ./tf.sh plan -out $(planFile)
    displayName: Terraform Plan
    name: terraformPlan
  - task: AzureCLI@2
    inputs:
      azureSubscription: "tf-sp-on-ado"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        ./tf.sh apply $(planFile)
    displayName: Terraform Apply
    name: terraformApply